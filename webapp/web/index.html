<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Audio Pro C20 W</title>
<style>
  :root {
    --bg: #f4f3f0; --card: #ffffff; --text: #1b1b1d; --muted: #6d6d73;
    --line: #e3e1dc; --accent: #c8553d; --accent-text: #fff; --chip: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121214; --card: #1c1c1f; --text: #ededee; --muted: #9a9aa2;
      --line: #2c2c31; --accent: #e0694f; --chip: #26262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px; }
  .now { display: flex; gap: 14px; align-items: center; }
  .art { width: 76px; height: 76px; border-radius: 10px; background: var(--chip) center/cover;
    flex: none; display: grid; place-items: center; color: var(--muted); font-size: 28px; }
  .meta { min-width: 0; }
  .title { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { display: inline-block; margin-top: 6px; font-size: 12px; padding: 2px 8px;
    border-radius: 99px; background: var(--chip); color: var(--muted); }
  .transport { display: flex; justify-content: center; gap: 18px; margin: 16px 0 10px; }
  button { font: inherit; color: inherit; background: var(--chip); border: 0; border-radius: 10px;
    padding: 8px 12px; cursor: pointer; }
  button:active { transform: scale(.97); }
  .round { width: 48px; height: 48px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
  .round.big { width: 60px; height: 60px; background: var(--accent); color: var(--accent-text); }
  .round svg { width: 22px; height: 22px; fill: currentColor; }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol input { flex: 1; accent-color: var(--accent); }
  .vol .num { width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button.on { background: var(--accent); color: var(--accent-text); }
  select, input[type=text], input[type=search] { font: inherit; color: var(--text); background: var(--chip);
    border: 1px solid transparent; border-radius: 10px; padding: 9px 11px; width: 100%; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.st { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  li.st:first-child { border-top: 0; }
  li.st .ico { width: 34px; height: 34px; border-radius: 8px; background: var(--chip) center/cover; flex: none; }
  li.st .n { flex: 1; min-width: 0; cursor: pointer; }
  li.st .n div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.st .n small { color: var(--muted); }
  li.st.playing .n div { color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > :first-child { flex: 1; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button.on { background: var(--text); color: var(--bg); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); padding: 8px 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .add { display: grid; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="devname">Audio Pro C20 W</h1>
    <span class="status" id="status">verbinden…</span>
  </header>

  <section class="card">
    <div class="now">
      <div class="art" id="art">♪</div>
      <div class="meta">
        <div class="title" id="title">—</div>
        <div class="artist" id="artist"></div>
        <span class="src" id="mode">—</span>
      </div>
    </div>
    <div class="transport">
      <button class="round" data-cmd="setPlayerCmd:prev" aria-label="Vorige">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="round big" id="playpause" aria-label="Afspelen/pauze">
        <svg viewBox="0 0 24 24" id="ppicon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="round" data-cmd="setPlayerCmd:next" aria-label="Volgende">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="vol">
      <button class="round" id="mute" aria-label="Dempen" style="width:38px;height:38px">
        <svg viewBox="0 0 24 24" id="muteicon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <input type="range" min="0" max="100" id="vol" aria-label="Volume">
      <span class="num" id="volnum">–</span>
    </div>
  </section>

  <section class="card">
    <h2>Bron</h2>
    <div class="chips" id="sources"></div>
  </section>

  <section class="card">
    <div class="tabs">
      <button class="on" data-tab="fav">Mijn zenders</button>
      <button data-tab="search">Zoeken</button>
    </div>
    <div id="tab-fav">
      <ul id="stations"></ul>
      <details>
        <summary>Zender handmatig toevoegen</summary>
        <form class="add" id="addform">
          <input type="text" name="name" placeholder="Naam" required>
          <input type="text" name="url" placeholder="Stream-URL (http/https, mp3/aac/m3u)" required>
          <button type="submit">Toevoegen</button>
        </form>
      </details>
    </div>
    <div id="tab-search" class="hidden">
      <form class="row" id="searchform">
        <input type="search" name="q" placeholder="Zoek radiozender (bijv. 'NPO', 'jazz')">
        <button type="submit">Zoek</button>
      </form>
      <ul id="results" style="margin-top:8px"></ul>
    </div>
  </section>

  <section class="card">
    <h2>Equalizer</h2>
    <select id="eq"></select>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const SOURCES = [
  ["wifi", "Wi-Fi", [10, 20, 31, 32, 36, 1, 2]],
  ["bluetooth", "Bluetooth", [41]],
  ["HDMI", "TV (HDMI)", [49]],
  ["optical", "Optisch", [43]],
  ["line-in", "Line-in", [40]],
  ["phono", "Phono", [42, 47]],
];
const MODE_NAMES = { 0: "Inactief", 1: "AirPlay", 2: "DLNA", 10: "Wi-Fi", 11: "USB", 20: "Netwerkstream",
  31: "Spotify Connect", 32: "TIDAL Connect", 36: "Qobuz", 40: "Line-in", 41: "Bluetooth",
  42: "Phono", 43: "Optisch", 47: "Line-in 2", 49: "HDMI ARC", 99: "Multiroom" };

let stations = [];
let state = {};
let lastUrl = localStorage.getItem("lastUrl") || "";
let volDragging = false;

async function cmd(c) {
  const r = await fetch("/api/cmd?c=" + encodeURIComponent(c));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const hex = (h) => {
  if (!h || !/^[0-9A-Fa-f]+$/.test(h)) return h || "";
  try { return decodeURIComponent(h.replace(/(..)/g, "%$1")); } catch { return h; }
};
const clean = (s) => (!s || /^un_?know/i.test(s)) ? "" : s;

function setStatus(text, err) {
  const el = $("#status");
  el.textContent = text;
  el.classList.toggle("err", !!err);
}

async function poll() {
  try {
    const [p, m] = await Promise.all([cmd("getPlayerStatusEx"), cmd("getMetaInfo").catch(() => ({}))]);
    state = p;
    const md = m.metaData || {};
    const mode = +p.mode;
    const playing = p.status === "play";
    // Streams started via play:<url> report vendor "CustomPushUrl" and the URL as title.
    const rawTitle = clean(md.title) || clean(hex(p.Title));
    const pushed = p.vendor === "CustomPushUrl";
    const station = pushed ? (stations.find((s) => s.url === rawTitle) || stations.find((s) => s.url === lastUrl)) : null;
    const isUrl = /^https?:\/\//.test(rawTitle);
    const title = station?.name || (isUrl ? "Internetradio" : rawTitle) || (playing ? "Speelt af" : "Gestopt");
    $("#title").textContent = title;
    $("#artist").textContent = [clean(md.artist) || clean(hex(p.Artist)), clean(md.album) || clean(hex(p.Album))].filter(Boolean).join(" — ");
    $("#mode").textContent = pushed ? "Radio" : MODE_NAMES[mode] || "Modus " + mode;
    if (pushed) $("#artist").textContent = md.bitRate && md.bitRate !== "unknow" ? md.bitRate + " kbps" : "";
    const art = clean(md.albumArtURI) || station?.favicon || "";
    $("#art").style.backgroundImage = art ? `url("${art}")` : "";
    $("#art").textContent = art ? "" : "♪";
    $("#ppicon").innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    if (!volDragging) { $("#vol").value = p.vol; $("#volnum").textContent = p.vol; }
    $("#mute").style.opacity = p.mute === "1" ? 0.45 : 1;
    document.querySelectorAll("#sources button").forEach((b) => b.classList.toggle("on", b.dataset.modes.split(",").includes(String(mode))));
    document.querySelectorAll("#stations li").forEach((li) => li.classList.toggle("playing", !!station && li.dataset.url === station.url));
    setStatus(playing ? "speelt af" : p.status === "pause" ? "gepauzeerd" : "verbonden");
  } catch (e) {
    setStatus("geen verbinding", true);
  }
}

async function run(c) {
  try { await cmd(c); } catch (e) { setStatus(e.message, true); }
  setTimeout(poll, 400);
}

async function playStation(s) {
  lastUrl = s.url;
  localStorage.setItem("lastUrl", s.url);
  const isList = /\.(m3u8?|pls)(\?|$)/i.test(s.url) && !/\.m3u8/i.test(s.url);
  setStatus("afstemmen op " + s.name + "…");
  await run((isList ? "setPlayerCmd:m3u:play:" : "setPlayerCmd:play:") + s.url);
}

function stationItem(s, { onRemove, onAdd } = {}) {
  const li = document.createElement("li");
  li.className = "st";
  li.dataset.url = s.url;
  const ico = document.createElement("div");
  ico.className = "ico";
  if (s.favicon) ico.style.backgroundImage = `url("${s.favicon}")`;
  const n = document.createElement("div");
  n.className = "n";
  const name = document.createElement("div");
  name.textContent = s.name;
  const small = document.createElement("small");
  small.textContent = [s.country, s.codec, s.bitrate ? s.bitrate + " kbps" : ""].filter(Boolean).join(" · ") || new URL(s.url).host;
  n.append(name, small);
  n.onclick = () => playStation(s);
  li.append(ico, n);
  const play = document.createElement("button");
  play.textContent = "▶";
  play.onclick = () => playStation(s);
  li.append(play);
  if (onAdd) { const b = document.createElement("button"); b.textContent = "＋"; b.title = "Toevoegen aan mijn zenders"; b.onclick = () => onAdd(s, b); li.append(b); }
  if (onRemove) { const b = document.createElement("button"); b.textContent = "✕"; b.title = "Verwijderen"; b.onclick = () => onRemove(s); li.append(b); }
  return li;
}

function renderStations() {
  const ul = $("#stations");
  ul.replaceChildren(...stations.map((s) => stationItem(s, { onRemove: removeStation })));
  if (!stations.length) ul.innerHTML = '<li class="empty">Nog geen zenders — zoek er een of voeg hem toe.</li>';
}

async function saveStations() {
  await fetch("/api/stations", { method: "PUT", body: JSON.stringify(stations) });
  renderStations();
}

function removeStation(s) {
  if (!confirm(`"${s.name}" verwijderen?`)) return;
  stations = stations.filter((x) => x !== s);
  saveStations();
}

function addStation(s, btn) {
  if (!stations.some((x) => x.url === s.url)) {
    stations.push({ name: s.name, url: s.url, favicon: s.favicon || "" });
    saveStations();
  }
  if (btn) { btn.textContent = "✓"; btn.disabled = true; }
}

$("#addform").onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  addStation({ name: f.get("name").trim(), url: f.get("url").trim() });
  e.target.reset();
};

$("#searchform").onsubmit = async (e) => {
  e.preventDefault();
  const q = new FormData(e.target).get("q").trim();
  const ul = $("#results");
  ul.innerHTML = '<li class="empty">Zoeken…</li>';
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const res = await r.json();
    if (!r.ok) throw new Error(res.error);
    ul.replaceChildren(...res.map((s) => stationItem(s, { onAdd: addStation })));
    if (!res.length) ul.innerHTML = '<li class="empty">Niets gevonden.</li>';
  } catch (err) {
    ul.innerHTML = `<li class="empty">Zoeken mislukt: ${err.message}</li>`;
  }
};

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("#tab-fav").classList.toggle("hidden", b.dataset.tab !== "fav");
  $("#tab-search").classList.toggle("hidden", b.dataset.tab !== "search");
});

document.querySelectorAll("[data-cmd]").forEach((b) => b.onclick = () => run(b.dataset.cmd));
$("#playpause").onclick = () => {
  if (state.status === "play") return run("setPlayerCmd:pause");
  if (state.status === "pause") return run("setPlayerCmd:resume");
  const s = stations.find((x) => x.url === lastUrl) || stations[0];
  if ([0, 10, 20].includes(+state.mode) && s) return playStation(s);
  run("setPlayerCmd:resume");
};
$("#mute").onclick = () => run("setPlayerCmd:mute:" + (state.mute === "1" ? 0 : 1));
const vol = $("#vol");
vol.oninput = () => { volDragging = true; $("#volnum").textContent = vol.value; };
vol.onchange = async () => { await run("setPlayerCmd:vol:" + vol.value); volDragging = false; };

$("#sources").replaceChildren(...SOURCES.map(([id, label, modes]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.dataset.modes = modes.join(",");
  b.onclick = () => run("setPlayerCmd:switchmode:" + id);
  return b;
}));

$("#eq").onchange = (e) => run("EQLoad:" + e.target.value);

(async function init() {
  stations = await (await fetch("/api/stations")).json();
  renderStations();
  try {
    const st = await cmd("getStatusEx");
    if (st.DeviceName) { $("#devname").textContent = st.DeviceName.replace(/-[0-9A-F]{4}$/, ""); document.title = st.DeviceName; }
    const eqs = await cmd("EQGetList");
    if (Array.isArray(eqs)) $("#eq").replaceChildren(...eqs.map((n) => new Option(n, n)));
  } catch {}
  poll();
  setInterval(poll, 2500);
})();
</script>
</body>
</html>
